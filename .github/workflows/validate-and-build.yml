name: Validate and build Windows portable
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/prepare_tiles.py
      - run: python -m unittest discover -s tests -v
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: node tests/test_browser.js
  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install pyinstaller==6.22.3
      - run: python scripts/prepare_tiles.py
      - run: python -m unittest discover -s tests -v
      - run: python build_windows.py
      - run: ./dist/Cyberpunk-Dataterm-Tracker.exe --check-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64-portable
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
      - name: Publish Windows release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.4.1 --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create v0.4.1 dist/*.zip dist/SHA256SUMS.txt --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --latest --title "v0.4.1 — Missing Fast Travel Points / Frequent Flyer Tracker" --notes "Updated validated catalog removes two extra terminal records. Final bilingual frontend, bundled offline map and fixed browser opening. Developed with AI assistance. English by default with a Spanish language selector. Read-only local save reader for verified Cyberpunk 2077 2.50 format 277/2500. Includes bundled offline map and optional official map iframe. Unsigned Windows executable. Please read README and docs/VALIDATION.md before use."
          }
