<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="mapPageTitle">Dataterm map</title>
<style>
:root{color-scheme:dark;--yellow:#fcee09;--cyan:#00f0ff}
*{box-sizing:border-box}
body{margin:0;background:#08080a;color:#ebebe4;font:14px 'Segoe UI',sans-serif;display:flex;flex-direction:column;height:100vh}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#111114;border-bottom:1px solid #2a2a30}
header strong{font:700 13px 'Bahnschrift','Segoe UI',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--yellow);margin-right:auto}
select,button{font:600 12px 'Bahnschrift','Segoe UI',sans-serif;letter-spacing:.06em;background:#08080a;color:#ebebe4;border:1px solid #2a2a30;border-bottom:2px solid #8c8405;border-radius:0;padding:7px 10px}
button{color:var(--cyan);border-color:var(--cyan);cursor:pointer;text-transform:uppercase}
button:hover{background:var(--cyan);color:#000}
select:focus-visible,button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
p{margin:0;padding:8px 14px;font-size:12px;color:#8d8d96;background:#0a0a0c}
svg{flex:1;width:100%;min-height:0;display:block;touch-action:none;cursor:grab;background:radial-gradient(circle at 50% 45%,#14140f,#08080a 70%)}
.btn{font:600 12px 'Bahnschrift','Segoe UI',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#000;background:var(--yellow);padding:8px 12px;cursor:pointer}.btn:hover{background:#fff}.btn:focus-within{outline:2px solid var(--cyan);outline-offset:2px}button:disabled{opacity:.35;cursor:not-allowed}svg:active{cursor:grabbing}
circle{stroke:#000;stroke-width:2;vector-effect:non-scaling-stroke;cursor:pointer}
circle:focus{stroke:#fff;stroke-width:4;outline:0}
#tooltip{position:fixed;left:14px;bottom:14px;max-width:85%;background:#111114f2;border:1px solid var(--yellow);border-left-width:3px;padding:10px 14px;pointer-events:none;font-size:13px}
text{fill:#6e6e5a;font:700 150px 'Bahnschrift','Segoe UI',sans-serif;letter-spacing:6px;text-transform:uppercase;pointer-events:none}
</style>
<body><header><strong data-i18n="mapNorth">Night City</strong><select id="filter" data-i18n-aria="mapFilter"><option value="all" data-i18n="mapAll">All locations</option><option value="PENDIENTES" data-i18n="PENDIENTES">Missing</option><option value="DESCUBIERTOS" data-i18n="DESCUBIERTOS">Discovered</option><option value="NO VERIFICADOS" data-i18n="NO VERIFICADOS">Unverified</option></select><button id="reset" data-i18n="mapReset">Reset zoom</button></header><p data-i18n="mapLegend"></p><svg id="map" viewBox="-4300 -4800 10000 11000" role="img" data-i18n-aria="mapLocations"><g id="tile-layer"></g><g id="grid"></g><g id="districts"></g><g id="points"></g></svg><div id="tooltip" hidden></div><script src="reference.js"></script><script src="locales.js"></script><script src="i18n.js"></script><script src="map.js"></script></body></html>
