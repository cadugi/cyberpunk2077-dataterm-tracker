<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapa de dataterms</title><style>body{margin:0;background:#101c26;color:#dceef4;font:14px 'Segoe UI',sans-serif}header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px}select,button{background:#21333f;color:#ddedf4;border:1px solid #45606e;border-radius:4px;padding:7px}svg{width:100%;height:440px;display:block;touch-action:none;cursor:grab;background:#12232f}circle{stroke:#09131b;stroke-width:2;vector-effect:non-scaling-stroke;cursor:pointer}circle:focus{stroke:white;stroke-width:5;outline:0}#tooltip{position:fixed;left:15px;bottom:14px;max-width:85%;background:#101820ef;border:1px solid #627d8b;border-radius:6px;padding:12px;pointer-events:none}p{color:#acc0cb;font-size:12px;padding:0 14px}text{fill:#9eb6c5;font-size:150px;pointer-events:none}</style><body><header><strong>Night City · norte ↑</strong><select id="filter" aria-label="Estado de los puntos"><option value="all">Todos los puntos con coordenadas</option><option value="PENDIENTES">Pendientes</option><option value="DESCUBIERTOS">Descubiertos</option><option value="NO VERIFICADOS">No verificados</option></select><button id="reset">Restablecer zoom</button></header><p>Amarillo: pendiente · Verde: descubierto · Gris: sin verificar. Mapa esquemático sin calles. Arrastra para moverlo y usa la rueda para ampliar.</p><svg id="map" viewBox="-4300 -4800 10000 11000" role="img" aria-label="Ubicaciones de dataterms"><g id="grid"></g><g id="districts"></g><g id="points"></g></svg><div id="tooltip" hidden></div><script src="reference.js"></script><script src="map.js"></script></body></html>
